name: Package desktop apps and cool2mcool

on:
  workflow_dispatch:
    inputs:
      target:
        description: Packages to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
      release_tag:
        description: Optional v* tag to publish, or to supplement with Windows packages
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: package-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-macos:
    name: macOS Apple Silicon
    if: inputs.target == 'all'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi package environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.75.0
          environments: package
          locked: true
          cache: true

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build macOS app and DMG
        run: pixi run --locked -e package package-macos

      - name: Archive macOS app bundle
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/C-Studio.app"
          "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/C-Studio-arm64.app.zip"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: c-studio-macos-arm64-${{ github.run_number }}
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.zip
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  package-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi package environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.75.0
          environments: package
          locked: true
          cache: true

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Windows installers
        run: pixi run --locked -e package package-windows

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: c-studio-windows-x64-${{ github.run_number }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  package-cool2mcool:
    name: cool2mcool ${{ matrix.platform_name }}
    if: inputs.target == 'all'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: Linux x64
            runner: ubuntu-22.04
            asset_suffix: linux-x86_64
          - platform_name: Linux ARM64
            runner: ubuntu-24.04-arm
            asset_suffix: linux-aarch64
          - platform_name: macOS Apple Silicon
            runner: macos-15
            asset_suffix: macos-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi cool2mcool environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.75.0
          working-directory: tools/cool2mcool
          locked: true
          cache: true

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./tools/cool2mcool -> target"

      - name: Test and build cool2mcool
        working-directory: tools/cool2mcool
        run: |
          pixi run --locked check
          pixi run --locked build
          ./target/release/cool2mcool --version

      - name: Package cool2mcool
        id: package
        working-directory: tools/cool2mcool
        shell: bash
        run: |
          set -euo pipefail

          version=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          if [[ -z "$version" ]]; then
            echo "Unable to determine cool2mcool version from Cargo.toml."
            exit 1
          fi

          archive="cool2mcool-v${version}-${{ matrix.asset_suffix }}"
          mkdir -p "dist/$archive"
          cp target/release/cool2mcool "dist/$archive/"
          cp README.md "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload cool2mcool package
        uses: actions/upload-artifact@v4
        with:
          name: cool2mcool-${{ matrix.asset_suffix }}-${{ github.run_number }}
          path: tools/cool2mcool/dist/${{ steps.package.outputs.archive }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: >-
      ${{
        always() &&
        inputs.release_tag != '' &&
        needs.package-windows.result == 'success' &&
        (
          inputs.target == 'windows' ||
          (
            inputs.target == 'all' &&
            needs.package-macos.result == 'success' &&
            needs.package-cool2mcool.result == 'success'
          )
        )
      }}
    needs:
      - package-macos
      - package-windows
      - package-cool2mcool
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ github.run_number }}"
          path: release-assets
          merge-multiple: true

      - name: Download existing release assets
        if: inputs.target == 'windows'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" >/dev/null
          mkdir existing-release-assets
          gh release download "$RELEASE_TAG" --dir existing-release-assets

      - name: Prepare release assets and checksums
        env:
          PACKAGE_TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir release-files
          while IFS= read -r -d '' source; do
            name=$(basename "$source")
            if [[ -e "release-files/$name" ]]; then
              echo "Duplicate release asset name: $name"
              exit 1
            fi
            cp "$source" "release-files/$name"
          done < <(find release-assets -type f -print0)

          required_patterns=('*.exe' '*.msi')
          if [[ "$PACKAGE_TARGET" == 'all' ]]; then
            required_patterns+=(
              '*.zip'
              '*.dmg'
              'cool2mcool-*-linux-x86_64.tar.gz'
              'cool2mcool-*-linux-aarch64.tar.gz'
              'cool2mcool-*-macos-arm64.tar.gz'
            )
          fi

          for pattern in "${required_patterns[@]}"; do
            if ! compgen -G "release-files/$pattern" >/dev/null; then
              echo "Missing required release asset: $pattern"
              exit 1
            fi
          done

          mkdir checksum-files
          if [[ "$PACKAGE_TARGET" == 'windows' ]]; then
            while IFS= read -r -d '' source; do
              name=$(basename "$source")
              if [[ "$name" != 'SHA256SUMS' ]]; then
                cp "$source" "checksum-files/$name"
              fi
            done < <(find existing-release-assets -type f -print0)
          fi
          cp release-files/* checksum-files/

          (
            cd checksum-files
            sha256sum ./*
          ) > "$RUNNER_TEMP/SHA256SUMS"
          cp "$RUNNER_TEMP/SHA256SUMS" release-files/SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_TARGET: ${{ inputs.target }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' release_assets \
            < <(find release-files -maxdepth 1 -type f ! -name 'SHA256SUMS' -print0)

          if [[ "$PACKAGE_TARGET" == 'windows' ]]; then
            gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber
            gh release upload "$RELEASE_TAG" release-files/SHA256SUMS --clobber
          elif gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber
            gh release upload "$RELEASE_TAG" release-files/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" \
              "${release_assets[@]}" \
              release-files/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
