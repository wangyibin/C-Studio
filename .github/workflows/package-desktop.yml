name: Package desktop apps and cool2mcool

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing v* tag to publish the built packages
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: package-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-macos:
    name: macOS ${{ matrix.platform_name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: Apple Silicon
            runner: macos-15
            rust_target: aarch64-apple-darwin
            asset_arch: arm64
            binary_arch: arm64
          - platform_name: Intel
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            asset_arch: x64
            binary_arch: x86_64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify desktop release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: node scripts/release-version.mjs

      - name: Set up Pixi package environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.75.0
          environments: package
          locked: true
          cache: true

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build macOS app and DMG
        run: pixi run --locked -e package package-macos

      - name: Verify macOS executable architecture
        run: >-
          lipo
          "src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/C-Studio.app/Contents/MacOS/c-studio"
          -verify_arch ${{ matrix.binary_arch }}

      - name: Archive macOS app bundle
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/C-Studio.app"
          "src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/C-Studio-${{ matrix.asset_arch }}.app.zip"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: c-studio-macos-${{ matrix.asset_arch }}-${{ github.run_number }}
          path: |
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.zip
            src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  package-linux:
    name: Linux x64
    # Build on the oldest supported base to keep the glibc requirement low.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify desktop release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: node scripts/release-version.mjs

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config curl wget file patchelf \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Set up Pixi package environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.75.0
          environments: package
          locked: true
          cache: true

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Test packaging validation
        run: pixi run --locked -e package node --test scripts/test-package-linux.mjs scripts/test-release-local.mjs

      - name: Build Linux Debian package and AppImage
        run: pixi run --locked -e package package-linux

      - name: Check Linux runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          binary=src-tauri/target/x86_64-unknown-linux-gnu/release/c-studio
          dependencies=$(ldd "$binary")
          printf '%s\n' "$dependencies"
          if grep -E 'not found|\.pixi/|libhdf5' <<< "$dependencies"; then
            echo 'Linux desktop must use system runtime libraries and statically linked HDF5.'
            exit 1
          fi

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: c-studio-linux-x64-${{ github.run_number }}
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  package-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify desktop release version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: node scripts/release-version.mjs

      - name: Set up Pixi package environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.75.0
          environments: package
          locked: true
          cache: true

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Windows installers
        run: pixi run --locked -e package package-windows

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: c-studio-windows-x64-${{ github.run_number }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7

  package-cool2mcool:
    name: cool2mcool ${{ matrix.platform_name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform_name: Linux x64
            runner: ubuntu-22.04
            asset_suffix: linux-x86_64
          - platform_name: Linux ARM64
            runner: ubuntu-24.04-arm
            asset_suffix: linux-aarch64
          - platform_name: macOS Apple Silicon
            runner: macos-15
            asset_suffix: macos-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Pixi cool2mcool environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.75.0
          working-directory: tools/cool2mcool
          locked: true
          cache: true

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./tools/cool2mcool -> target"

      - name: Test and build cool2mcool
        working-directory: tools/cool2mcool
        run: |
          pixi run --locked check
          pixi run --locked build
          ./target/release/cool2mcool --version

      - name: Package cool2mcool
        id: package
        working-directory: tools/cool2mcool
        shell: bash
        run: |
          set -euo pipefail

          version=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          if [[ -z "$version" ]]; then
            echo "Unable to determine cool2mcool version from Cargo.toml."
            exit 1
          fi

          archive="cool2mcool-v${version}-${{ matrix.asset_suffix }}"
          mkdir -p "dist/$archive"
          cp target/release/cool2mcool "dist/$archive/"
          cp README.md "dist/$archive/"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload cool2mcool package
        uses: actions/upload-artifact@v4
        with:
          name: cool2mcool-${{ matrix.asset_suffix }}-${{ github.run_number }}
          path: tools/cool2mcool/dist/${{ steps.package.outputs.archive }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: >-
      ${{
        always() &&
        inputs.release_tag != '' &&
        needs.package-windows.result == 'success' &&
        needs.package-macos.result == 'success' &&
        needs.package-linux.result == 'success' &&
        needs.package-cool2mcool.result == 'success'
      }}
    needs:
      - package-macos
      - package-windows
      - package-linux
      - package-cool2mcool
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ github.run_number }}"
          path: release-assets
          merge-multiple: true

      - name: Prepare release assets and checksums
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir release-files
          while IFS= read -r -d '' source; do
            name=$(basename "$source")
            if [[ ! -s "$source" ]]; then
              echo "Empty release asset: $name"
              exit 1
            fi
            if [[ -e "release-files/$name" ]]; then
              echo "Duplicate release asset name: $name"
              exit 1
            fi
            cp "$source" "release-files/$name"
          done < <(find release-assets -type f -print0)

          required_patterns=(
              "C-Studio_${RELEASE_TAG#v}_x64-setup.exe"
              "C-Studio_${RELEASE_TAG#v}_x64*.msi"
              'C-Studio-arm64.app.zip'
              'C-Studio-x64.app.zip'
              "C-Studio_${RELEASE_TAG#v}_aarch64.dmg"
              "C-Studio_${RELEASE_TAG#v}_x64.dmg"
              "C-Studio_${RELEASE_TAG#v}_amd64.deb"
              "C-Studio_${RELEASE_TAG#v}_amd64.AppImage"
              'cool2mcool-*-linux-x86_64.tar.gz'
              'cool2mcool-*-linux-aarch64.tar.gz'
              'cool2mcool-*-macos-arm64.tar.gz'
          )

          for pattern in "${required_patterns[@]}"; do
            if ! compgen -G "release-files/$pattern" >/dev/null; then
              echo "Missing required release asset: $pattern"
              exit 1
            fi
          done

          mkdir checksum-files
          cp release-files/* checksum-files/

          (
            cd checksum-files
            sha256sum ./*
          ) > "$RUNNER_TEMP/SHA256SUMS"
          cp "$RUNNER_TEMP/SHA256SUMS" release-files/SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' release_assets \
            < <(find release-files -maxdepth 1 -type f ! -name 'SHA256SUMS' -print0)

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber
            gh release upload "$RELEASE_TAG" release-files/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" \
              "${release_assets[@]}" \
              release-files/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "$RELEASE_TAG"
          fi
