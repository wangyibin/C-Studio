name: Package desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: package-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-macos:
    name: macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi package environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.75.0
          environments: package
          locked: true
          cache: true

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build macOS app and DMG
        run: pixi run --locked -e package package-macos

      - name: Archive macOS app bundle
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/C-Studio.app"
          "src-tauri/target/aarch64-apple-darwin/release/bundle/macos/C-Studio-arm64.app.zip"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: c-studio-macos-arm64-${{ github.run_number }}
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.zip
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7

  package-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi package environment
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.75.0
          environments: package
          locked: true
          cache: true

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build Windows installers
        run: pixi run --locked -e package package-windows

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: c-studio-windows-x64-${{ github.run_number }}
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 7
