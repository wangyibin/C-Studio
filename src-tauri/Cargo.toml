[package]
name = "c-studio"
version = "0.5.3"
description = "C-Studio desktop application"
edition = "2021"
license = "MIT"

[lib]
name = "c_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
portable-hdf5 = ["cstudio-core/portable-hdf5"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cstudio-core = { path = "../crates/cstudio-core" }
flate2 = "1"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"

# C-Studio's development window is also used for real multi-gigabase datasets.
# Keep debug assertions and symbols, but optimize the per-contact projection
# loop so `tauri dev` does not turn a seconds-scale release scan into minutes.
[profile.dev]
opt-level = 2

#[profile.release]
#opt-level = 3
#lto = "thin"
#codegen-units = 1
