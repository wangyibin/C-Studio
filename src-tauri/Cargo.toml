[package]
name = "c-studio"
version = "0.1.0"
description = "C-Studio desktop application"
edition = "2021"

[lib]
name = "c_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cstudio-core = { path = "../crates/cstudio-core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[dev-dependencies]
serde_json = "1"
