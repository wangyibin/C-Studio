[package]
name = "cool2mcool"
version = "0.7.0"
edition = "2021"
rust-version = "1.80"
description = "Generate normalized multi-resolution Cooler files from fixed 1 kb COOL inputs"
license = "MIT"
readme = "README.md"
keywords = ["cooler", "mcool", "hic", "genomics"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hdf5 = "0.8"
hdf5-sys = { version = "0.8", features = ["static", "zlib"] }
libc = "0.2"
rayon = "1.10"
tempfile = "3.27"
