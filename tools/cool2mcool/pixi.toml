[workspace]
name = "cool2mcool"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]

[system-requirements]
linux = "3.10.0"
libc = "2.17"


[dependencies]
rust = ">=1.80,<2"
cmake = ">=3.30,<5"
make = ">=4.4,<5"

# hdf5-sys/static compiles its supported HDF5 1.10.7 source release. Linux
# receives its complete GNU toolchain from Pixi; macOS uses Xcode's SDK linker.
[target.linux-64.dependencies]
compilers = ">=1.7,<2"

[target.linux-aarch64.dependencies]
compilers = ">=1.7,<2"

[target.osx-arm64.activation.env]
CC = "/usr/bin/clang"
CXX = "/usr/bin/clang++"
AR = "/usr/bin/ar"
RANLIB = "/usr/bin/ranlib"
CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER = "/usr/bin/clang"

[target.linux-64.activation.env]
CC = "x86_64-conda-linux-gnu-cc"
CXX = "x86_64-conda-linux-gnu-c++"
AR = "x86_64-conda-linux-gnu-ar"
RANLIB = "x86_64-conda-linux-gnu-ranlib"
CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "x86_64-conda-linux-gnu-cc"

[target.linux-aarch64.activation.env]
CC = "aarch64-conda-linux-gnu-cc"
CXX = "aarch64-conda-linux-gnu-c++"
AR = "aarch64-conda-linux-gnu-ar"
RANLIB = "aarch64-conda-linux-gnu-ranlib"
CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER = "aarch64-conda-linux-gnu-cc"

[feature.benchmark]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

[feature.benchmark.dependencies]
pretext-suite = "==0.0.2"
3d-dna = "==201008"

[feature.benchmark.tasks]
benchmark-tools = "command -v PretextMap && command -v run-asm-pipeline.sh"

[environments]
benchmark = ["benchmark"]

[tasks]
build = "cargo build --release --locked"
test = "cargo test --locked"
fmt-check = "cargo fmt --check"
check = { depends-on = ["fmt-check", "test"] }
run = { cmd = "cargo run --release --locked --", depends-on = ["build"] }
